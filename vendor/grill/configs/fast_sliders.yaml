# EXPERIMENT — NOT the default (measured slower). Kept for reference.
#
# Hypothesis: run the mechanical reconciliation/canonicalization SQL loops on
# gpt-4.1-mini instead of gpt-4.1 for a speedup. MEASURED 2026-06-25 on one paper:
# 690s / $0.82 vs the gpt-4.1 baseline's 413s / $1.22 — i.e. SLOWER. A weaker model
# needs MORE agentic loop iterations (1.15M input tokens) and the output schema
# drifted (moving question-rephrasing to mini changed it). Conclusion: per-call
# model speed is not the bottleneck — the sequential CALL COUNT is. The real fix is
# structural (deterministic pre-pass + embedding-based canonicalization), not a
# model swap. Left here so the negative result is reproducible.
#
# Relative paths (prompt_file, library_of_guidelines_path) resolve against the
# sliders repo cwd, which the driver sets to GRAPH_SEARCH_SLIDERS_ROOT.
experiment: wiki_celeb
system: sliders
system_config:
  generate_task_guidelines: false
  derive_schema_from_sample:
    enabled: false
    sample_size: 5
    random_state: 42
    save_filename: derived_schema.yaml
  rephrase_question:
    enabled: true
    prompt_file: sliders/rephrase_question_component.prompt
    library_of_guidelines_path: sliders_taxonomy.json
  generate_schema:
    add_extra_information_class: false
    add_document_text: true
    generate_schema_type: library_based
    library_of_guidelines_path: sliders_taxonomy.json
  extract_schema:
    decompose_fields: false
    dedupe_merged_rows: false
    num_samples_per_chunk: 1
    is_relevant_chunk: true
    extract_quotes: true
  merge_tables:
    merge_strategy: recon_v2
    reconciliation:
      debug_mode: false
      primary_key_selection:
        version: v1
        max_candidates: 10
        max_inspections_per_candidate: 10
        max_retries: 3
      canonicalization:
        mode: two_pass
        max_cycles: 20
        max_retries_per_cycle: 3
        max_inspection_history: 3
        inspections_per_field: 50
        null_handling:
          max_inspections: 5
          placeholder_text: UNKNOWN
          verification:
            enable: false
            max_inspections: 5
      controller_executor_loop:
        max_iterations: 5
        max_controller_inspections: 5
        max_executor_inspections: 5
        max_sql_attempts: 3
        verification:
          enable: true
          max_inspections: 5
        context_generator:
          enable: true
          model: gpt-4.1-mini   # was gpt-4.1
          max_rows: 20
      non_pk_canonicalization:
        enable: true
        inspections_per_field: 5
        column_selector:
          max_inspections: 5
          excluded_columns:
            - row_id
            - page_number
            - __reconciliation_context__
            - number_instances
          excluded_patterns:
            - _quote
            - _rationale
            - _confidence
      statistics:
        enable: true
        filename: reconciliation_stats.json
  inspect_answer:
    enable_citation_generation: true
    enable_reconciliation_stats_verbalization: true
  check_if_merge_needed: false
  force_sql: false
  answer_strategy: sql_inspect
  models:
    # --- kept on gpt-4.1 (quality-critical, few calls) ---
    answer:
      model: gpt-4.1
      max_tokens: 8192
      temperature: 0.0
    answer_tool_output:
      model: gpt-4.1
      max_tokens: 8192
      temperature: 0.0
    generate_schema:
      model: gpt-4.1
      max_tokens: 8192
      temperature: 0.0
    # --- already mini ---
    answer_no_table:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    extract_schema:
      model: gpt-4.1-mini
      max_tokens: 32000
      temperature: 0.0
    is_relevant_chunk:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    select_guidelines_for_schema:
      model: gpt-4.1-mini
      max_tokens: 2000
      temperature: 0.0
    # --- swapped gpt-4.1 -> gpt-4.1-mini (the hot reconciliation/canonicalization loops) ---
    merge_tables:
      model: gpt-4.1-mini
      max_tokens: 32000
      temperature: 0.0
    select_primary_key:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    canonicalize_fields:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    column_selector:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    context_generator:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    handle_null_pks:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    check_objective_necessity:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    rephrase_question:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    check_if_merge_needed:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    task_guidelines:
      model: gpt-4.1-mini
      max_tokens: 8192
      temperature: 0.0
    direct_answer:
      model: gpt-4.1
      max_tokens: 8192
      temperature: 0.0
    force_answer:
      model: gpt-4.1
      max_tokens: 8192
      temperature: 0.0
experiment_config:
  questions_path: null
  files_dir: null
  num_questions: null
  random_state: 42
  document_description: "Several related papers for different genes with results, a heterogeneous sample of related papers"
  document_config:
    chunk_size: 16000
    overlap_size: 0
output_file: sliders_output.json
